name: Daily unfollow email

on:
  schedule:
    - cron: "0 11 * * *"   # 05:00 UTC = 08:00 in Kenya (EAT)
  workflow_dispatch:
    inputs:
      resend:
        description: "Batch number to send again (leave empty to send the next batch)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: unfollow-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND: ${{ github.event.inputs.resend }}
        run: |
          if [ -n "$RESEND" ]; then
            python daily_unfollow_email.py --resend "$RESEND"
          else
            python daily_unfollow_email.py
          fi

      - name: Save progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update progress" && git push)
